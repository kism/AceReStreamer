---
name: Type Check

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - ".vscode/**"
      - ".github/dependabot.yml"
      - ".github/workflows/ghcr.yml"
      - ".gitattributes"
      - "**/.gitignore"
      - "**/.dockerignore"
      - ".readthedocs.yaml"
      - "docker/**"
      - "docker-compose*.yml"
      - "scripts/**" # Local dev scripts, not run in CI
      - "frontend/public/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the project
        run: uv sync --group type --group test --group docs

      - name: Check types with ty
        run: uv run ty check .

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          package-json-file: frontend/package.json

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript checks
        run: pnpm run typecheck
