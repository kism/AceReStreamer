---
name: Lint

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - ".vscode/**"
      - ".github/dependabot.yml"
      - ".github/workflows/ghcr.yml"
      - ".gitattributes"
      - "**/.gitignore"
      - "**/.dockerignore"
      - ".readthedocs.yaml"
      - "docker/**"
      - "docker-compose*.yml"
      - "scripts/**" # Local dev scripts, not run in CI
      - "frontend/public/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_py:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3

  check_js:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest
          working-dir: "frontend"

      - name: Run Biome
        run: |
          cd frontend
          biome ci .
